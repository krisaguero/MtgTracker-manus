name: Publication Safety

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-publication-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify publishable source is free of local configuration and obvious credentials
        run: pnpm vitest run server/publicationSafety.test.ts
