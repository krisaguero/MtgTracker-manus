name: Morning Daily Movers Refresh

on:
  schedule:
    - cron: '0 8 * * *' # Every day at 8:00 AM UTC
  workflow_dispatch:

concurrency:
  group: daily-market-movers
  cancel-in-progress: false

jobs:
  refresh-market-movers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Daily Market Movers
        run: node scripts/daily-market-movers.mjs

      - name: Commit and Push Updated Market Artifacts
        run: |
          git config --global user.name 'MTG Morning Bot'
          git config --global user.email 'bot@mtgtracker.local'
          git add client/src/data/dailyMarketSnapshot.json data/market/daily data/market/daily-movers-history.json
          if git diff --cached --quiet; then
            echo "No generated market artifacts changed."
            exit 0
          fi
          git commit -m "chore(market): refresh daily movers [skip ci]"
          git push
