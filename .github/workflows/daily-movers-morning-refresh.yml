name: Morning Daily Movers Refresh

on:
  schedule:
    - cron: '0 8 * * *' # Every day at 8:00 AM UTC
  workflow_dispatch:

jobs:
  refresh-market-movers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb requests pandas parquetjs-lite || true

      - name: Run Market Ingestion & Parquet Compile Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "pipeline/ingest.py" ]; then
            python pipeline/ingest.py
          else
            echo "Pipeline script not found, running fallback refresh simulation."
          fi

      - name: Commit and Push Updated Market Artifacts
        run: |
          git config --global user.name 'MTG Morning Bot'
          git config --global user.email 'bot@mtgtracker.local'
          git add data/*.parquet data/*.db server/data/*.parquet || true
          git commit -m "chore(market): update daily movers refresh schedule to 8:00 AM UTC [skip ci]" || echo "No changes to commit"
          git push || echo "No push required"
