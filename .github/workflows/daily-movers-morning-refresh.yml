name: Daily Market Data Refresh

on:
  schedule:
    - cron: "0 8 * * *" # Every day at 8:00 AM UTC
  workflow_dispatch:

concurrency:
  group: daily-market-movers
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  refresh-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync with latest main before generating data
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Refresh Commander and precon card-price snapshot
        id: commander-price-refresh
        run: node scripts/refresh-commander-card-prices.mjs
        continue-on-error: true

      - name: Report Commander price refresh failure without blocking mover updates
        if: steps.commander-price-refresh.outcome == 'failure'
        run: echo "::warning::Commander/precon price snapshot refresh failed; the existing dated snapshot was retained."

      - name: Run daily market movers
        run: node scripts/daily-market-movers.mjs

      - name: Mirror historical price history for frontend charts
        run: cp data/market/daily-movers-history.json client/src/data/dailyMoverHistory.json

      - name: Build five-category MTG finance feed
        run: >-
          python3 scripts/mtg-finance/build_tracker_movers_feed.py
          --snapshot client/src/data/dailyMarketSnapshot.json
          --history data/market/daily-movers-history.json
          --output client/public/mtg-movers.json

      - name: Build daily Market Watch research feed
        run: pnpm market:research-feed

      - name: Validate generated data and application types
        run: |
          git diff --check
          pnpm check

      - name: Commit and push generated market artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MTG Market Data Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- \
            client/public/mtg-movers.json \
            client/src/data/commanderCardPriceMeta.json \
            client/src/data/commanderCardPriceSnapshot.json \
            client/src/data/dailyMarketSnapshot.json \
            client/src/data/dailyMoverHistory.json \
            client/src/data/marketPredictionLedger.json \
            client/src/data/marketResearchFeed.json \
            data/market/daily \
            data/market/daily-movers-history.json \
            data/market/prediction-ledger.json \
            data/market/research

          staged_paths="$(git diff --cached --name-only)"
          unexpected_paths=''
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              client/public/mtg-movers.json|client/src/data/commanderCardPriceMeta.json|client/src/data/commanderCardPriceSnapshot.json|client/src/data/dailyMarketSnapshot.json|client/src/data/dailyMoverHistory.json|client/src/data/marketPredictionLedger.json|client/src/data/marketResearchFeed.json|data/market/daily-movers-history.json|data/market/prediction-ledger.json)
                ;;
              data/market/daily/*|data/market/research/*)
                ;;
              *)
                unexpected_paths+="$path\n"
                ;;
            esac
          done <<< "$staged_paths"

          if [[ -n "$unexpected_paths" ]]; then
            echo 'Refusing to commit files outside the generated market-data allowlist:' >&2
            printf '%b' "$unexpected_paths" >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo 'No generated market artifacts changed.'
            exit 0
          fi

          git diff --cached --check
          git commit -m 'chore(market): refresh daily market data [skip ci]'

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Push rejected; rebasing on the latest main before retry $((attempt + 1))."
              git fetch origin main
              git rebase origin/main
            fi
          done

          echo 'Unable to publish the daily market refresh after three attempts.' >&2
          exit 1
